name: Super Gamehub Lite - Baseline APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'patches/**'
      - 'extension/**'
      - 'tests/**'
      - 'signing/**'
      - 'tools/check-signing-key.sh'
      - 'tools/set-apk-version.py'
      - 'patch.sh'
      - 'generate-patches.sh'
      - '.github/workflows/build-debug.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'extension/**'
      - 'tests/**'
      - 'signing/**'
      - 'tools/check-signing-key.sh'
      - 'tools/set-apk-version.py'
      - 'patch.sh'
      - 'generate-patches.sh'
      - '.github/workflows/build-debug.yml'

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_APK_URL: https://github.com/Producdevity/gamehub-lite/releases/download/v5.1.0-patch/GameHub-5.1.0.apk
  SOURCE_APK_MD5: 42db81116bf3c74e52e6f6afb4ec9f91
  APKTOOL_VERSION: "2.12.1"

jobs:
  build:
    # Untrusted pull requests must never receive the permanent app-signing key.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Test input diagnostics and mouse batching
        run: |
          mkdir -p stats-tests
          javac -source 8 -target 8 -d stats-tests extension/SuperInputStats.java extension/SuperMouseBatcher.java extension/SuperCameraMotion.java extension/SuperFrameGenControl.java tests/SuperInputStatsTest.java tests/SuperMouseBatcherTest.java tests/SuperCameraMotionTest.java tests/SuperFrameGenControlTest.java
          java -cp stats-tests SuperInputStatsTest
          java -cp stats-tests SuperMouseBatcherTest
          java -cp stats-tests SuperCameraMotionTest
          java -cp stats-tests SuperFrameGenControlTest

      - name: Test APK version metadata
        run: python3 -m unittest discover -s tests -p 'test_apk_version.py'

      - name: Install apktool
        run: |
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -O /usr/local/bin/apktool.jar
          # Simple wrapper script instead of relying on upstream master branch
          cat > /usr/local/bin/apktool << 'WRAPPER'
          #!/bin/bash
          exec java -jar /usr/local/bin/apktool.jar "$@"
          WRAPPER
          chmod +x /usr/local/bin/apktool

      - name: Download source APK
        run: |
          mkdir -p apk
          wget -q "$SOURCE_APK_URL" -O apk/GameHub-5.1.0.apk

          md5=$(md5sum apk/GameHub-5.1.0.apk | awk '{print $1}')
          if [ "$md5" != "$SOURCE_APK_MD5" ]; then
            echo "::error::MD5 mismatch: expected $SOURCE_APK_MD5, got $md5"
            exit 1
          fi
          echo "MD5 verified: $md5"

      - name: Set up Android SDK
        if: hashFiles('extension/*.java') != ''
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: 'build-tools;34.0.0'

      - name: Compile Java extension to classes.dex
        if: hashFiles('extension/*.java') != ''
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            # Fallback: install platform 34 if missing
            sdkmanager "platforms;android-34"
          fi

          mkdir -p ext_classes ext_dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d ext_classes extension/*.java

          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/d8" \
            --release \
            --output ext_dex \
            $(find ext_classes -name '*.class')

          ls -la ext_dex/classes.dex
          echo "EXTENSION_DEX_PATH=$GITHUB_WORKSPACE/ext_dex/classes.dex" >> "$GITHUB_ENV"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SUPER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.SUPER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SIGNING_KEY_B64" || -z "$KEYSTORE_PASS" ]]; then
            echo '::error::Permanent signing secrets are missing. Restore the original key; a new random key will not be generated.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/super-signing"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/super-signing/app.p12"
          export KEYSTORE="$RUNNER_TEMP/super-signing/app.p12"
          export KEY_ALIAS=supergamehub
          bash tools/check-signing-key.sh
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SUPER_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "SUPER_VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASS: ${{ secrets.SUPER_SIGNING_PASSWORD }}
        run: ./patch.sh

      - name: Verify APK signing identity and update version
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs output/GameHub-Lite.apk > output/SIGNING.txt
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import os, re, subprocess
          expected = Path('signing/certificate-sha256.txt').read_text().strip()
          certs = Path('output/SIGNING.txt').read_text()
          actual = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)', certs)
          if actual != [expected]:
              raise SystemExit('APK signing certificate mismatch')
          aapt = os.environ['ANDROID_SDK_ROOT'] + '/build-tools/34.0.0/aapt'
          info = subprocess.check_output([aapt, 'dump', 'badging', 'output/GameHub-Lite.apk'], text=True)
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", info)
          if not package or package.groups() != ('super.gamehub.lite', os.environ['SUPER_VERSION_CODE'], os.environ['SUPER_VERSION_NAME']):
              raise SystemExit('APK package or update version mismatch')
          print('APK signature, package and Android update version verified')
          PYVERIFY

      - name: Remove restored private key
        if: always()
        run: rm -f "$RUNNER_TEMP/super-signing/app.p12"

      - name: Record baseline provenance
        run: |
          cp output/GameHub-Lite.apk "output/Super-Gamehub-Lite-${SUPER_VERSION_NAME}.apk"
          sha256sum "output/Super-Gamehub-Lite-${SUPER_VERSION_NAME}.apk" > output/SHA256SUMS
          {
            echo "Project: Super Gamehub Lite"
            echo "Stage: mouse batching, configurable gated frame generation and input diagnostics"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Source APK: $SOURCE_APK_URL"
            echo "Source MD5: $SOURCE_APK_MD5"
            echo "Apktool: $APKTOOL_VERSION"
            echo "Package: super.gamehub.lite (separate application identity)"
            echo "Signing: permanent Super Gamehub Lite certificate"
            echo "Version: $SUPER_VERSION_NAME ($SUPER_VERSION_CODE)"
            cat output/SIGNING.txt
          } > output/BASELINE.txt

      - name: Upload baseline APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Super-Gamehub-Lite-${{ env.SUPER_VERSION_NAME }}
          path: |
            output/Super-Gamehub-Lite-${{ env.SUPER_VERSION_NAME }}.apk
            output/SHA256SUMS
            output/BASELINE.txt
            output/SIGNING.txt
          if-no-files-found: error
          retention-days: 30

      # Regenerate patches from the built APK and compare against repo.
      # Detects patches that apply with fuzz/offset but aren't canonical.
      # If drifted, uploads refreshed patches as a downloadable artifact.
      - name: Refresh patches from built APK
        id: refresh
        run: |
          cp -r patches/ /tmp/repo-patches/

          ./generate-patches.sh apk/GameHub-5.1.0.apk output/GameHub-Lite.apk

          if diff -rq /tmp/repo-patches/diffs/ patches/diffs/ > /dev/null 2>&1 && \
             diff -q /tmp/repo-patches/files_to_patch.txt patches/files_to_patch.txt > /dev/null 2>&1 && \
             diff -q /tmp/repo-patches/files_to_add.txt patches/files_to_add.txt > /dev/null 2>&1 && \
             diff -q /tmp/repo-patches/files_to_delete.txt patches/files_to_delete.txt > /dev/null 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "Patches are canonical - no drift detected"
          else
            echo "status=drifted" >> "$GITHUB_OUTPUT"
            echo "::warning::Patches have drifted from canonical form. Download the refreshed-patches artifact to update them."
            echo ""
            echo "=== Changed files ==="
            diff -rq /tmp/repo-patches/ patches/ 2>/dev/null || true
          fi

      - name: Upload refreshed patches
        if: steps.refresh.outputs.status == 'drifted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: refreshed-patches
          path: patches/
          retention-days: 7
